name: Club FFXIV
punchline: Spatial-audio housing clubs — tune in or DJ
description: "Turns FFXIV housing into spatial-audio venues. Hear muffled music drift through the door as you approach a calibrated plot; walk inside, full audio, BGM ducks out. Plays Twitch / YouTube / SoundCloud / Icecast / Shoutcast streams. DJs publish their house to a registry so visitors auto-tune; optional EFF-diceware passphrase gating, local-only overrides, and a public directory of listed clubs."
